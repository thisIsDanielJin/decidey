<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Decidey · your tiny decision mouse</title>
  <meta name="description" content="A cute 3D mouse that makes up your mind for you." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐭</text></svg>" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <canvas id="confetti"></canvas>

  <main class="ui">
    <header class="brand">
      <h1>Decidey</h1>
      <p class="tagline">Can't decide? Let the mouse squeak.</p>
    </header>

    <section class="panel">
      <label for="options">Your options</label>
      <textarea
        id="options"
        rows="5"
        placeholder="One per line…&#10;Pizza&#10;Sushi&#10;Tacos"
        spellcheck="false"
      >Pizza
Sushi
Tacos</textarea>

      <div class="buttons">
        <button id="decide" class="btn btn-primary">Decide! 🐭</button>
        <button id="clear" class="btn btn-ghost">Clear</button>
      </div>

      <p id="hint" class="hint">Add at least 2 options, then poke the mouse.</p>
    </section>

    <div id="result" class="result" aria-live="polite"></div>
  </main>

  <script type="module" src="./main.js"></script>
</body>
</html>
